name: ✨ 功能请求 · Feature Request
description: 提出一个新想法 · Suggest a new idea
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请描述你的想法。
        Thanks for the suggestion! Tell us your idea.
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题 · Problem
      description: 这个功能要解决什么痛点？· What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 · Proposed Solution
      description: 你希望如何实现？· How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 · Alternatives
      description: 考虑过其他方案吗？· Any alternatives considered?
