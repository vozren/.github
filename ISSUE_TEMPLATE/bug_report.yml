name: 🐛 Bug 报告 · Bug Report
description: 报告一个问题以帮助我们改进 · Report a problem to help us improve
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请填写以下信息帮助我们定位问题。
        Thanks for reporting! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: 问题描述 · Description
      description: 清晰简洁地描述问题 · A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 · Steps to Reproduce
      description: 如何复现这个问题？· How can we reproduce it?
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现错误 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 · Expected Behavior
      description: 你期望发生什么？· What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息 · Environment
      description: 操作系统、版本等 · OS, version, etc.
      placeholder: |
        - OS: macOS 15
        - Version: 1.0.0
  - type: textarea
    id: logs
    attributes:
      label: 日志/截图 · Logs/Screenshots
      description: 相关的错误日志或截图 · Relevant logs or screenshots
      render: shell
