<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-vo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad-vo1)"/>
  <!-- V letterform -->
  <path d="M 120 140 L 200 380 L 280 140" 
        fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- O letterform (circle) -->
  <circle cx="360" cy="260" r="90" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <!-- Sound wave inside O -->
  <rect x="330" y="240" width="10" height="40" rx="5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="350" y="220" width="10" height="80" rx="5" fill="#FFFFFF" opacity="0.9"/>
  <rect x="370" y="240" width="10" height="40" rx="5" fill="#FFFFFF" opacity="0.9"/>
</svg>
