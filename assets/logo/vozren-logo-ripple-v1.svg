<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-ripple1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad-ripple1)"/>
  <!-- V as sound source (clean, bold, centered) -->
  <path d="M 196 180 L 256 320 L 316 180" 
        fill="none" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- O ripples expanding outward from V -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.75"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
</svg>
