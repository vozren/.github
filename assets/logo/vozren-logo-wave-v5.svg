<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-wave5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad-wave5)"/>
  <!-- V with curved wave lines -->
  <path d="M 120 140 Q 200 260 200 380 Q 200 260 280 140" 
        fill="none" stroke="#FFFFFF" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small wave accents on V -->
  <path d="M 150 170 Q 170 170 170 190" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M 230 170 Q 250 170 250 190" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <!-- O made of sound wave spiral -->
  <path d="M 360 170 A 90 90 0 1 1 359 170" 
        fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" opacity="0.9"/>
  <path d="M 360 200 A 60 60 0 1 1 359 200" 
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  <path d="M 360 230 A 30 30 0 1 1 359 230" 
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.4"/>
</svg>
