<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-tech2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="grad-v2glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad-tech2)"/>
  <!-- V with white-to-sky gradient + neon glow -->
  <path d="M 196 180 L 256 320 L 316 180" 
        fill="none" stroke="url(#grad-v2glow)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)"/>
  <!-- O ripples -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.75"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.5"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.3"/>
</svg>
