    <rect x="164" y="248" width="12" height="48" rx="6" fill="url(#grad-b1)"/>
    <rect x="188" y="232" width="12" height="80" rx="6" fill="url(#grad-b1)"/>
    <rect x="212" y="216" width="12" height="112" rx="6" fill="url(#grad-b1)"/>
    <rect x="236" y="232" width="12" height="80" rx="6" fill="url(#grad-b1)"/>
    <rect x="260" y="248" width="12" height="48" rx="6" fill="url(#grad-b1)"/>
  </g>
  <!-- O: sound ripple ring attached to V's right tip, expanding right -->
  <circle cx="336" cy="128" r="44" fill="none" stroke="url(#grad-b1)" stroke-width="22"/>
  <circle cx="336" cy="128" r="70" fill="none" stroke="url(#grad-b1)" stroke-width="7" opacity="0.35"/>
