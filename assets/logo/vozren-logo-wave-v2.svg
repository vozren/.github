  <path d="M 140 160 Q 170 240 200 320 Q 230 240 260 160" 
        fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.6"/>
  <!-- O made of sound wave rings -->
  <circle cx="360" cy="260" r="75" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.3"/>
  <circle cx="360" cy="260" r="55" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.5"/>
  <circle cx="360" cy="260" r="35" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.8"/>
  <circle cx="360" cy="260" r="15" fill="#FFFFFF" opacity="0.9"/>
</svg>
