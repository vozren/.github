<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-sv1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- O rings: sound ripple expanding outward -->
  <circle cx="256" cy="224" r="150" fill="none" stroke="url(#grad-sv1)" stroke-width="14" opacity="0.28"/>
  <circle cx="256" cy="224" r="118" fill="none" stroke="url(#grad-sv1)" stroke-width="22" opacity="0.85"/>
  <!-- Single V: left half only, from top-left to bottom-center -->
  <path d="M 128 128 L 224 320"
        fill="none" stroke="url(#grad-sv1)" stroke-width="40" stroke-linecap="round"/>
  <!-- Sound wave bars along the single V -->
  <rect x="150" y="160" width="10" height="36" rx="5" fill="url(#grad-sv1)" transform="rotate(-25 155 178)"/>
  <rect x="175" y="210" width="8" height="52" rx="4" fill="url(#grad-sv1)" transform="rotate(-20 179 236)"/>
  <rect x="198" y="260" width="12" height="30" rx="6" fill="url(#grad-sv1)" transform="rotate(-15 204 275)"/>
</svg>
