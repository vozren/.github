<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-wave1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad-wave1)"/>
  <!-- V made of sound wave bars -->
  <rect x="120" y="140" width="24" height="120" rx="12" fill="#FFFFFF" opacity="0.9"/>
  <rect x="160" y="180" width="24" height="160" rx="12" fill="#FFFFFF" opacity="0.9"/>
  <rect x="200" y="220" width="24" height="200" rx="12" fill="#FFFFFF" opacity="0.9"/>
  <rect x="240" y="180" width="24" height="160" rx="12" fill="#FFFFFF" opacity="0.9"/>
  <rect x="280" y="140" width="24" height="120" rx="12" fill="#FFFFFF" opacity="0.9"/>
  <!-- O made of concentric sound rings -->
  <circle cx="360" cy="260" r="70" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.4"/>
  <circle cx="360" cy="260" r="50" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.6"/>
  <circle cx="360" cy="260" r="30" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.9"/>
</svg>
