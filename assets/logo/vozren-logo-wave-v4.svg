<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-wave4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad-wave4)"/>
  <!-- V made of vertical sound bars -->
  <rect x="110" y="130" width="20" height="100" rx="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="145" y="170" width="20" height="140" rx="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="180" y="210" width="20" height="180" rx="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="215" y="170" width="20" height="140" rx="10" fill="#FFFFFF" opacity="0.85"/>
  <rect x="250" y="130" width="20" height="100" rx="10" fill="#FFFFFF" opacity="0.85"/>
  <!-- O as ripple rings -->
  <circle cx="360" cy="250" r="85" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.2"/>
  <circle cx="360" cy="250" r="65" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.4"/>
  <circle cx="360" cy="250" r="45" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.7"/>
  <circle cx="360" cy="250" r="25" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.9"/>
</svg>
