<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad-vo-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Transparent background -->
  <!-- V letterform -->
  <path d="M 100 100 L 180 340 L 260 100" 
        fill="none" stroke="url(#grad-vo-dark)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- O letterform (circle) -->
  <circle cx="340" cy="220" r="80" fill="none" stroke="url(#grad-vo-dark)" stroke-width="40"/>
  <!-- Sound wave bars inside O -->
  <rect x="315" y="205" width="10" height="30" rx="5" fill="url(#grad-vo-dark)"/>
  <rect x="335" y="185" width="10" height="70" rx="5" fill="url(#grad-vo-dark)"/>
  <rect x="355" y="205" width="10" height="30" rx="5" fill="url(#grad-vo-dark)"/>
</svg>
