  <circle cx="256" cy="200" r="80" fill="none" stroke="#FFFFFF" stroke-width="20" opacity="0.5"/>
  <circle cx="256" cy="200" r="112" fill="none" stroke="#FFFFFF" stroke-width="20" opacity="0.7"/>
  <!-- V shape at bottom -->
  <path d="M 176 280 L 256 400 L 336 280" 
